name: CI & Execution Accuracy Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: text_to_sql_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/text_to_sql_db
      READONLY_DATABASE_URL: postgresql+asyncpg://sql_readonly:readonly_password@localhost:5432/text_to_sql_db
      SQL_DIALECT: postgres
      SECRET_KEY: ci-test-jwt-secret-key-1234567890
      ENCRYPTION_KEY: 0G2t7L4D3tM-0fN7V8zL9kP1mQ2wE4rT6yU8iO0pA1s=
      AUTH_DB_PATH: vector_cache/auth.db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed Sample Database
        run: |
          python scripts/seed_sample_db.py --dbname text_to_sql_db --user postgres --password postgrespassword --port 5432

      - name: Setup Read-Only PostgreSQL Role
        run: |
          python scripts/setup_readonly_role.py --dbname text_to_sql_db --admin-user postgres --admin-password postgrespassword --readonly-user sql_readonly --readonly-password readonly_password --port 5432

      - name: Rebuild Grounding Indexes
        run: |
          python -m app.index_schema

      - name: Run Pytest Suite
        run: |
          pytest -v -o asyncio_mode=auto

      - name: UI Smoke & Boot Check
        run: |
          python -m py_compile app/ui.py
          streamlit run app/ui.py --server.headless true --server.port 8501 &
          sleep 5
          curl --fail --retry 5 --retry-connrefused http://localhost:8501/_stcore/health

      - name: Run Execution Accuracy (EX) Benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/run_eval.py --eval-set tests/eval/eval_set.json --threshold 0.70
